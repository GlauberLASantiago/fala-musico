<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitador por Voz - v1.3</title>
    <!-- Favicon incorporado conforme sua preferência -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>">
    
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --active: #dc2626;
            --active-hover: #b91c1c;
            --border-color: #cbd5e1;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            max-width: 650px;
            width: 100%;
            border-radius: var(--radius);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        /* Indicador de Versão */
        .version-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #e2e8f0;
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        header {
            text-align: center;
            padding-top: 10px;
        }

        h1 {
            font-size: 1.6rem;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        #btn-start {
            background-color: var(--primary);
            color: white;
            flex: 1;
            min-width: 180px;
        }

        #btn-start:hover {
            background-color: var(--primary-hover);
        }

        #btn-start.listening {
            background-color: var(--active);
        }

        #btn-start.listening:hover {
            background-color: var(--active-hover);
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        .status-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--text-muted);
        }

        .dot.active {
            background-color: #16a34a;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(22, 163, 74, 0); }
            100% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
        }

        .textarea-container {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        textarea {
            width: 100%;
            height: 250px;
            padding: 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1.05rem;
            line-height: 1.5;
            color: var(--text-main);
            background-color: #fff;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .helper-text {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Indicador de Versão -->
        <div class="version-badge">v1.3 (Anti-Bug Mobile)</div>

        <header>
            <h1>Digitador por Voz</h1>
            <p class="subtitle">Fale pausadamente e o texto aparecerá na tela</p>
        </header>

        <div class="status-container">
            <div id="status-dot" class="dot"></div>
            <span id="status-text">Microfone desativado</span>
        </div>

        <div class="textarea-container">
            <textarea id="text-output" placeholder="Clique em 'Iniciar Ditado' e comece a falar..."></textarea>
        </div>

        <div class="controls">
            <button id="btn-start">Iniciar Ditado</button>
            <button id="btn-copy" class="btn-secondary">Selecionar e Copiar</button>
            <button id="btn-clear" class="btn-secondary">Limpar Texto</button>
        </div>

        <div class="action-bar">
            <span class="helper-text">O microfone reinicia sozinho nas pausas para evitar erros no Android.</span>
        </div>
    </div>

    <script>
        let recognition;
        let isListening = false;
        
        let textoConsolidado = ''; // Texto que já foi confirmado e salvo
        let textoTemporario = '';  // Texto da frase que está sendo dita no momento

        const btnStart = document.getElementById('btn-start');
        const btnCopy = document.getElementById('btn-copy');
        const btnClear = document.getElementById('btn-clear');
        const textOutput = document.getElementById('text-output');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');

        function atualizarTela() {
            // Junta o que já foi salvo com o que está sendo dito agora
            let textoDisplay = textoConsolidado;
            if (textoTemporario) {
                textoDisplay += (textoDisplay.length > 0 ? ' ' : '') + textoTemporario;
            }
            textOutput.value = textoDisplay;
            textOutput.scrollTop = textOutput.scrollHeight; // Rola para o final
        }

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Seu navegador não suporta reconhecimento de voz.");
                return false;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            
            // A MÁGICA ESTÁ AQUI: continuous = false
            // Isso força o motor do Android a limpar a memória após cada pausa que você faz,
            // impedindo que ele duplique o texto repetidamente.
            recognition.continuous = false; 
            recognition.interimResults = true;

            recognition.onstart = () => {
                isListening = true;
                statusText.textContent = "Ouvindo...";
                statusDot.classList.add('active');
                btnStart.textContent = 'Parar Ditado';
                btnStart.classList.add('listening');
                
                // Se o usuário digitou algo manualmente, nós assumimos isso como consolidado
                textoConsolidado = textOutput.value.trim();
            };

            recognition.onresult = (event) => {
                let currentText = '';
                let isFinal = false;

                // Como continuous é false, ele foca apenas na frase atual (index 0)
                for (let i = 0; i < event.results.length; i++) {
                    currentText += event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        isFinal = true;
                    }
                }

                textoTemporario = currentText.trim();
                atualizarTela();

                // Se o navegador disse que a frase acabou (você pausou a respiração)
                if (isFinal) {
                    textoConsolidado += (textoConsolidado.length > 0 ? ' ' : '') + textoTemporario;
                    textoTemporario = ''; // Limpa o temporário
                    // O evento 'onend' será chamado em seguida automaticamente
                }
            };

            recognition.onerror = (event) => {
                console.warn("Aviso: ", event.error);
                // Erros de "no-speech" são normais quando há silêncio.
            };

            recognition.onend = () => {
                // Como configuramos continuous=false, ele sempre cai aqui nas pausas.
                // Nosso código então religa o microfone automaticamente criando um loop perfeito.
                if (isListening) {
                    try {
                        recognition.start();
                    } catch (e) {
                        console.error("Erro ao reiniciar loop:", e);
                    }
                } else {
                    statusText.textContent = "Microfone desativado";
                    statusDot.classList.remove('active');
                    btnStart.textContent = 'Iniciar Ditado';
                    btnStart.classList.remove('listening');
                }
            };

            return true;
        }

        // Eventos dos Botões
        btnStart.addEventListener('click', () => {
            if (!recognition) {
                if (!initSpeechRecognition()) return;
            }

            if (!isListening) {
                try {
                    recognition.start();
                } catch (e) {
                    console.error("Erro ao iniciar:", e);
                }
            } else {
                isListening = false;
                recognition.stop();
            }
        });

        btnCopy.addEventListener('click', () => {
            if (!textOutput.value) return;
            
            textOutput.select();
            textOutput.setSelectionRange(0, 999999);

            navigator.clipboard.writeText(textOutput.value).then(() => {
                const originalText = btnCopy.textContent;
                btnCopy.textContent = "Copiado! ✓";
                setTimeout(() => {
                    btnCopy.textContent = originalText;
                }, 2000);
            }).catch(err => {
                console.error('Erro ao copiar: ', err);
            });
        });

        btnClear.addEventListener('click', () => {
            textoConsolidado = '';
            textoTemporario = '';
            textOutput.value = '';
        });
    </script>
</body>
</html>
