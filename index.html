<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ditado Musical por Voz</title>
    <!-- Favicon incorporado conforme sua preferência -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>">
    
    <style>
        :root {
            --bg-color: #f0f4f8;
            --text-main: #102a43;
            --primary: #005A9C;
            --active: #d64545;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 100%;
        }

        h1 { margin-bottom: 20px; font-size: 1.8rem; }

        #btn-start {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,90,156,0.3);
            margin-bottom: 30px;
        }

        #btn-start.listening {
            background-color: var(--active);
            box-shadow: 0 4px 15px rgba(214,69,69,0.4);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .note-display {
            font-size: 5rem;
            font-weight: 900;
            color: var(--primary);
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .debug {
            color: #829ab1;
            font-size: 0.9rem;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Fale uma Nota</h1>
        <button id="btn-start">Iniciar Microfone</button>
        
        <div id="note-display" class="note-display">--</div>
        <div id="debug-text" class="debug">Aguardando...</div>
    </div>

    <script>
        // 1. Dicionário de Notas (Ordenado das palavras MAIORES para as MENORES)
        // Isso resolve o problema de ele achar "dó" dentro de "dó sustenido".
        // Ele vai testar as combinações maiores primeiro.
        const notes = [
            { words: ["dó sustenido", "do sustenido", "ré bemol", "re bemol"], name: "C#", freq: 277.18 },
            { words: ["ré sustenido", "re sustenido", "mi bemol"], name: "D#", freq: 311.13 },
            { words: ["fá sustenido", "fa sustenido", "sol bemol"], name: "F#", freq: 369.99 },
            { words: ["sol sustenido", "lá bemol", "la bemol"], name: "G#", freq: 415.30 },
            { words: ["lá sustenido", "la sustenido", "si bemol"], name: "A#", freq: 466.16 },
            { words: ["dó", "do"], name: "Dó", freq: 261.63 },
            { words: ["ré", "re"], name: "Ré", freq: 293.66 },
            { words: ["mi"], name: "Mi", freq: 329.63 },
            { words: ["fá", "fa"], name: "Fá", freq: 349.23 },
            { words: ["sol"], name: "Sol", freq: 392.00 },
            { words: ["lá", "la"], name: "Lá", freq: 440.00 },
            { words: ["si"], name: "Si", freq: 493.88 }
        ];

        let audioCtx;
        let recognition;
        let isListening = false;

        const btnStart = document.getElementById('btn-start');
        const noteDisplay = document.getElementById('note-display');
        const debugText = document.getElementById('debug-text');

        // Inicializa o Áudio apenas no clique (regra dos navegadores)
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        // Toca a frequência com um envelope simples para não dar estalo
        function playTone(freq) {
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.value = freq;

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            
            // Envelope ADSR rápido e direto (500ms totais)
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(1, now + 0.05); // Attack
            gain.gain.exponentialRampToValueAtTime(0.3, now + 0.2); // Decay
            gain.gain.linearRampToValueAtTime(0, now + 0.5); // Release

            osc.start(now);
            osc.stop(now + 0.5);
        }

        function initSpeech() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Navegador não suporta reconhecimento de voz.");
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = true; // Mantém ouvindo
            recognition.interimResults = false; // Só processa quando a pessoa termina a frase/palavra

            recognition.onstart = () => {
                isListening = true;
                btnStart.textContent = 'Ouvindo... (Clique para parar)';
                btnStart.classList.add('listening');
                debugText.textContent = "Pode falar as notas...";
            };

            recognition.onresult = (event) => {
                // Pega a última frase dita
                const current = event.resultIndex;
                const transcript = event.results[current][0].transcript.toLowerCase().trim();
                
                debugText.textContent = `Ouviu: "${transcript}"`;

                // Busca se alguma nota foi dita (testa as maiores primeiro)
                for (let note of notes) {
                    for (let word of note.words) {
                        // Regex para buscar a palavra exata no meio de outras falas
                        const regex = new RegExp(`\\b${word}\\b`, 'i');
                        if (regex.test(transcript)) {
                            // Achou a nota! Mostra na tela e toca.
                            noteDisplay.textContent = note.name;
                            playTone(note.freq);
                            
                            // Efeito visual rápido
                            noteDisplay.style.transform = "scale(1.2)";
                            setTimeout(() => noteDisplay.style.transform = "scale(1)", 150);
                            
                            return; // Para no primeiro match encontrado
                        }
                    }
                }
            };

            recognition.onend = () => {
                // Se parar sozinho (por silêncio longo do navegador), reinicia automaticamente
                if (isListening) {
                    try { recognition.start(); } catch(e) {}
                } else {
                    btnStart.textContent = 'Iniciar Microfone';
                    btnStart.classList.remove('listening');
                    debugText.textContent = "Microfone parado.";
                }
            };
        }

        btnStart.addEventListener('click', () => {
            initAudio();
            if (!recognition) initSpeech();

            if (!isListening) {
                try { recognition.start(); } catch(e) {}
            } else {
                isListening = false;
                recognition.stop();
            }
        });
    </script>
</body>
</html>
