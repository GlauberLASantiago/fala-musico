<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitador por Voz</title>
    <!-- Favicon incorporado conforme sua preferência -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>">
    
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --active: #dc2626;
            --active-hover: #b91c1c;
            --border-color: #cbd5e1;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            max-width: 650px;
            width: 100%;
            border-radius: var(--radius);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
        }

        h1 {
            font-size: 1.6rem;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        #btn-start {
            background-color: var(--primary);
            color: white;
            flex: 1;
            min-width: 180px;
        }

        #btn-start:hover {
            background-color: var(--primary-hover);
        }

        #btn-start.listening {
            background-color: var(--active);
        }

        #btn-start.listening:hover {
            background-color: var(--active-hover);
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        .status-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--text-muted);
        }

        .dot.active {
            background-color: #16a34a;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(22, 163, 74, 0); }
            100% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
        }

        .textarea-container {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        textarea {
            width: 100%;
            height: 250px;
            padding: 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1.05rem;
            line-height: 1.5;
            color: var(--text-main);
            background-color: #fff;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .helper-text {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Digitador por Voz</h1>
            <p class="subtitle">Fale e o texto aparecerá continuamente na tela</p>
        </header>

        <div class="status-container">
            <div id="status-dot" class="dot"></div>
            <span id="status-text">Microfone desativado</span>
        </div>

        <div class="textarea-container">
            <textarea id="text-output" placeholder="Clique em 'Iniciar Ditado' e comece a falar..."></textarea>
        </div>

        <div class="controls">
            <button id="btn-start">Iniciar Ditado</button>
            <button id="btn-copy" class="btn-secondary">Selecionar e Copiar</button>
            <button id="btn-clear" class="btn-secondary">Limpar Texto</button>
        </div>

        <div class="action-bar">
            <span class="helper-text">Dica: O texto é acumulado automaticamente.</span>
        </div>
    </div>

    <script>
        let recognition;
        let isListening = false;
        let finalTranscript = ''; // Acumula o texto definitivo gerado

        const btnStart = document.getElementById('btn-start');
        const btnCopy = document.getElementById('btn-copy');
        const btnClear = document.getElementById('btn-clear');
        const textOutput = document.getElementById('text-output');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Seu navegador não suporta reconhecimento de voz. Utilize o Google Chrome ou Microsoft Edge.");
                return false;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = true; // Permite falar continuamente sem desligar sozinho
            recognition.interimResults = true; // Mostra palavras em tempo real enquanto você fala

            recognition.onstart = () => {
                isListening = true;
                statusText.textContent = "Ouvindo... Pode falar";
                statusDot.classList.add('active');
                btnStart.textContent = 'Parar Ditado';
                btnStart.classList.add('listening');
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';

                // Varre os resultados retornados pela API
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        // Adiciona espaço caso já exista texto prévio para não grudar as palavras
                        let text = event.results[i][0].transcript;
                        if (finalTranscript.length > 0 && !finalTranscript.endsWith(' ')) {
                            finalTranscript += ' ';
                        }
                        finalTranscript += text;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                // Exibe no textarea o texto definitivo acumulado + o texto temporário sendo falado agora
                textOutput.value = finalTranscript + interimTranscript;
                
                // Mantém a rolagem sempre no final do texto
                textOutput.scrollTop = textOutput.scrollHeight;
            };

            recognition.onerror = (event) => {
                console.warn("Aviso de reconhecimento: ", event.error);
            };

            recognition.onend = () => {
                // Se o usuário ainda quer ditar, mas a API fechou por pausa longa, reinicia sozinho
                if (isListening) {
                    try {
                        recognition.start();
                    } catch (e) {
                        console.error("Erro ao reiniciar reconhecimento:", e);
                    }
                } else {
                    statusText.textContent = "Microfone desativado";
                    statusDot.classList.remove('active');
                    btnStart.textContent = 'Iniciar Ditado';
                    btnStart.classList.remove('listening');
                }
            };

            return true;
        }

        // Botão Principal: Ligar/Desligar
        btnStart.addEventListener('click', () => {
            if (!recognition) {
                if (!initSpeechRecognition()) return;
            }

            if (!isListening) {
                // Pega o conteúdo atual do textarea caso o usuário tenha digitado algo manualmente
                finalTranscript = textOutput.value;
                try {
                    recognition.start();
                } catch (e) {
                    console.error("Erro ao iniciar:", e);
                }
            } else {
                isListening = false;
                recognition.stop();
            }
        });

        // Botão Selecionar Tudo e Copiar para a Área de Transferência
        btnCopy.addEventListener('click', () => {
            if (!textOutput.value) return;
            
            textOutput.select();
            textOutput.setSelectionRange(0, 999999); // Para dispositivos móveis/tablets

            navigator.clipboard.writeText(textOutput.value).then(() => {
                const originalText = btnCopy.textContent;
                btnCopy.textContent = "Copiado! ✓";
                setTimeout(() => {
                    btnCopy.textContent = originalText;
                }, 2000);
            }).catch(err => {
                console.error('Erro ao copiar: ', err);
            });
        });

        // Botão Limpar Texto
        btnClear.addEventListener('click', () => {
            finalTranscript = '';
            textOutput.value = '';
        });
    </script>
</body>
</html>
